<!doctype html><html lang="fr-CA"><head><link rel="stylesheet" href="./eclat-guided.css"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="stylesheet" href="./styles.css"><link rel="stylesheet" href="./premium-theme.css"><link rel="stylesheet" href="./premium-home.css"><link rel="stylesheet" href="./eclat.css"><link rel="stylesheet" href="./bubble-centering.css"><link rel="stylesheet" href="./ritual-titles.css"><link rel="stylesheet" href="./evening-eclat-switcher.css"><link rel="stylesheet" href="./eclat-photo-gallery-v179.css"><link rel="stylesheet" href="./loveroll-layout-fixes-v180.css"><link rel="stylesheet" href="./loveroll-nav-home-v181.css">
<link rel="stylesheet" href="./loveroll-cinematic-v183.css"><link rel="stylesheet" href="./loveroll-eclat-fidelity-v184.css"></head><body><main id="app"></main><script type="module">
import {eclatHtml} from './eclat-ui.mjs';
import {premiumHomeHtml,fitHomeLayout} from './premium-home.mjs';
const p=new URLSearchParams(location.search),mode=p.get('mode')||'gallery';
const people=[{user_id:'one',name:'Émilie'},{user_id:'two',name:'Fred'}];
const stage={access:true,active:true,coffret_id:12,minutes:60,chapter_index:2,chapter_number:2,variant_number:3,chapter_total:6,session_id:'test',my_choice:null,both_chosen:false,my_ready:false};
const params={
 gallery:{status:{access:true,active:false}},
 locked:{status:{access:false,active:false,total_cents:999}},
 detail:{status:{access:true,active:false},selected:3,details:true,minutes:60},
 stage:{status:stage,members:people,userId:'one'},
 waiting:{status:{...stage,my_choice:2},members:people,userId:'one'},
 reveal:{status:{...stage,my_choice:2,both_chosen:true,outcome:3},members:people,userId:'one'}
};
const root=document.querySelector('#app');
if(mode==='home'){
 root.className='loveroll-real-home';
 root.innerHTML=premiumHomeHtml({members:people,monthly:{monthly_activity:{face:12}}});
}else{
 root.className='loveroll-eclat-page';
 root.innerHTML=eclatHtml(params[mode]||params.gallery);
}
root.insertAdjacentHTML('beforeend','<nav class="nav"><div class="nav-inner"><button>Accueil</button><button>Soirée</button><button>Surprise</button><button>Avent</button><button>Réglages</button></div></nav>');
if(mode==='home'){fitHomeLayout(root);setTimeout(()=>{window.__fixtureReady=true;},80);}
else window.__fixtureReady=true;
</script></body></html>
