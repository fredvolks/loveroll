<!doctype html><html lang="fr-CA"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="stylesheet" href="./styles.css"><link rel="stylesheet" href="./premium-theme.css">
<link rel="stylesheet" href="./premium-home.css"><link rel="stylesheet" href="./evening-editorial.css">
<link rel="stylesheet" href="./premium-advent.css"><link rel="stylesheet" href="./ritual-scenes.css">
<link rel="stylesheet" href="./eclat.css"><link rel="stylesheet" href="./bubble-centering.css"><link rel="stylesheet" href="./evening-eclat-switcher.css">
</head><body><main id="app"></main><script type="module">
import {premiumHomeHtml,fitHomeLayout} from './premium-home.mjs';
import {premiumEveningHtml} from './premium-evening.mjs';
import {adventPremiumHtml} from './premium-advent.mjs';
const mode=new URL(location.href).searchParams.get('mode')||'home';
const members=[{user_id:'one',name:'Frederick'},{user_id:'two',name:'Émilie'}];
const root=document.querySelector('#app');
if(mode==='home'){
 root.className='loveroll-real-home';
 root.innerHTML=premiumHomeHtml({members,monthly:{monthly_activity:{face:12}}});
}else if(mode==='advent'){
 root.className='loveroll-advent-letters loveroll-advent-page';
 root.innerHTML=adventPremiumHtml({when:new Date('2026-12-10T17:00:00Z'),members,openings:[],dateTrusted:true});
}else if(mode==='evening'){
 root.className='loveroll-evening-page loveroll-editorial';
 root.innerHTML=premiumEveningHtml({members,me:'one',weeklyReady:false,weeklyCount:0,weeklyLimit:1,canStartEvening:false});
}
root.insertAdjacentHTML('beforeend','<nav class="nav"><div class="nav-inner"><button>Accueil</button><button>Soirée</button><button>Surprise</button><button>Avent</button><button>Réglages</button></div></nav>');
if(mode==='home'){fitHomeLayout(root);setTimeout(()=>{window.__fixtureReady=true;},130);}
else window.__fixtureReady=true;
</script></body></html>
