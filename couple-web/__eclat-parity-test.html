</head><body><main id="app"></main><script type="module">
import {premiumEveningHtml} from './premium-evening.mjs';

const root=document.querySelector('#app');
const people=[{user_id:'one',name:'A'},{user_id:'two',name:'B'}];
if(mode==='evening'){

 root.className='loveroll-eclat-page';
 root.innerHTML=eclatHtml({status:{access:true,active:false}});
}
