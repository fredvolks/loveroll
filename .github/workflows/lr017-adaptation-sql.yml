name: LR-017 adaptation — PostgreSQL 17 A/B consent
on:
  pull_request:
    paths:
      - 'couple-web/migrations/20261028_lr017_challenge_adaptation.sql'
      - 'couple-web/qa/lr017-*.sql'
      - '.github/workflows/lr017-adaptation-sql.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-adaptation-sql:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: loveroll_lr017
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d loveroll_lr017"
          --health-interval 5s
          --health-timeout 4s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Apply real migration and exercise verified A/B, refusal and outsider security
        env:
          PGPASSWORD: test-only
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d loveroll_lr017 \
            -f couple-web/qa/lr017-fixture.sql \
            -f couple-web/migrations/20261028_lr017_challenge_adaptation.sql \
            -f couple-web/qa/lr017-acceptance.sql
