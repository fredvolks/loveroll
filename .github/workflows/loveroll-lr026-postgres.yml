name: LoveRoll LR-026 isolated PostgreSQL

on:
  pull_request:
    paths:
      - "couple-web/lr026-server-variety.sql"
      - "couple-web/lr026-server-variety-smoke.sql"
      - "couple-web/lr026-postgres-fixture.sql"
      - "couple-web/lr026-postgres-rank.test.sql"
      - "couple-web/lr026-extract-helpers.cjs"
      - ".github/workflows/loveroll-lr026-postgres.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-smoke:
    name: Test private SQL helpers on disposable PostgreSQL 17
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lr026_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lr026_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: lr026_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify migration helper extraction syntax
        run: node --check couple-web/lr026-extract-helpers.cjs
      - name: Create isolated synthetic test schema
        run: psql -X -v ON_ERROR_STOP=1 -f couple-web/lr026-postgres-fixture.sql
      - name: Extract exact private SQL helpers (never patch production RPC)
        run: |
          node couple-web/lr026-extract-helpers.cjs > "$RUNNER_TEMP/lr026-private.sql"
          psql -X -v ON_ERROR_STOP=1 -f "$RUNNER_TEMP/lr026-private.sql"
      - name: Smoke test helper functions and privileges
        run: psql -X -v ON_ERROR_STOP=1 -f couple-web/lr026-server-variety-smoke.sql
      - name: Test official category and couple/session scoping
        run: psql -X -v ON_ERROR_STOP=1 -f couple-web/lr026-postgres-rank.test.sql
