name: LoveRoll CI reporter contract
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/loveroll-persistent-ci-report.yml'
      - '.github/workflows/loveroll-ci-reporter-selfcheck.yml'
      - 'scripts/ci-reporter-contract.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reporter-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check reporter permissions, safety and JavaScript
        run: node scripts/ci-reporter-contract.mjs
