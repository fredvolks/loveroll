name: LR-015 PostgreSQL transaction checks
on:
  pull_request:
    paths:
      - "couple-web/migrations/20261026_lr015_*.sql"
      - "couple-web/qa/lr015-*.sql"
      - ".github/workflows/lr015-postgres.yml"
  workflow_dispatch:
jobs:
  isolated-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: loveroll_lr015_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGDATABASE: loveroll_lr015_test
      PGUSER: postgres
      PGPASSWORD: local-test-only
    steps:
      - uses: actions/checkout@v4
      - name: PostgreSQL 17 local fixture (no real Supabase)
        run: |
          psql -X -v ON_ERROR_STOP=1 -f couple-web/qa/lr015-db-fixture.sql
      - name: Apply LR-015 migrations to isolated PostgreSQL
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -f couple-web/migrations/20261026_lr015_cycle_exclusion_registry.sql
          psql -X -v ON_ERROR_STOP=1 -f couple-web/migrations/20261026_lr015_recycle_incomplete_on_close.sql
          psql -X -v ON_ERROR_STOP=1 -f couple-web/migrations/20261026_lr015_z_atomic_respond_redraw.sql
      - name: Execute real PostgreSQL refusal quota privacy and closure scenarios
        run: |
          psql -X -v ON_ERROR_STOP=1 -f couple-web/qa/lr015-db-contract.sql
      - name: Parallel requests must produce one replacement ID
        shell: bash
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO public.couple_sessions
            (id,couple_id,opened_by,starting_user_id)
          VALUES('abababab-abab-4bab-8bab-abababababab','aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa',
            '11111111-1111-4111-8111-111111111111',
            '11111111-1111-4111-8111-111111111111');
          INSERT INTO public.couple_challenges
            (id,session_id,couple_id,offered_by,recipient,category,card_id,face,status)
          VALUES('cdcdcdcd-cdcd-4dcd-8dcd-cdcdcdcdcdcd',
            'abababab-abab-4bab-8bab-abababababab',
            'aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa',
            '22222222-2222-4222-8222-222222222222',
            '11111111-1111-4111-8111-111111111111',
            'SENSUEL',17,17,'proposed');
          SQL
          query="SELECT set_config('request.jwt.claim.sub','11111111-1111-4111-8111-111111111111'); SELECT public.love_respond_and_redraw('cdcdcdcd-cdcd-4dcd-8dcd-cdcdcdcdcdcd','refuse',false)->>'replacement_id';"
          psql -X -qAt -v ON_ERROR_STOP=1 -c "$query" >/tmp/lr015-first.txt 2>/tmp/lr015-first.err &
          first=$!
          psql -X -qAt -v ON_ERROR_STOP=1 -c "$query" >/tmp/lr015-second.txt 2>/tmp/lr015-second.err &
          second=$!
          wait "$first" || { cat /tmp/lr015-first.err; exit 1; }
          wait "$second" || { cat /tmp/lr015-second.err; exit 1; }
          first_id="$(tail -n 1 /tmp/lr015-first.txt)"
          second_id="$(tail -n 1 /tmp/lr015-second.txt)"
          test -n "$first_id" && test "$first_id" = "$second_id" || {
            echo "Two concurrent replies created inconsistent replacement IDs"; exit 1;
          }
          psql -X -v ON_ERROR_STOP=1 <<'SQL'
          DO $test$
          BEGIN
            IF (SELECT count(*) FROM public.love_challenge_redraws
                WHERE origin_id='cdcdcdcd-cdcd-4dcd-8dcd-cdcdcdcdcdcd')<>1 THEN
              RAISE EXCEPTION 'Concurrent refusal wrote multiple ledger rows';
            END IF;
            IF (SELECT count(*) FROM public.couple_challenges
                WHERE session_id='abababab-abab-4bab-8bab-abababababab'
                  AND status='proposed')<>1 THEN
              RAISE EXCEPTION 'Concurrent refusal produced multiple replacements';
            END IF;
          END
          $test$;
          SQL
          echo "LR015_PARALLEL_POSTGRES_OK"
