name: LoveRoll connected web checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: loveroll-web-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.scope.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - name: Detect application changes (full validation on uncertainty)
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          FORCE_FULL: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail
          code=true
          if [[ "$FORCE_FULL" != "true" && "$BASE_SHA" =~ ^[0-9a-f]{40}$ && "$BASE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            if git fetch --no-tags --depth=1 origin "$BASE_SHA" && git diff --name-only "$BASE_SHA" HEAD > /tmp/ci-changed-paths; then
              code=false
              while IFS= read -r path; do
                case "$path" in
                  docs/*.md|README.md) ;;
                  *) code=true; break ;;
                esac
              done < /tmp/ci-changed-paths
            fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Application validation required: $code"
  static-tests:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
