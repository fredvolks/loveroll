  # Stable required check: failures/cancellations in any group must block the lot.
  web-tests:
    if: always()
    needs: [changes, static-tests, browser-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Require all applicable checks
        env:
          SCOPE_RESULT: ${{ needs.changes.result }}
          CODE_CHANGED: ${{ needs.changes.outputs.code }}
          STATIC_RESULT: ${{ needs.static-tests.result }}
          BROWSER_RESULT: ${{ needs.browser-tests.result }}
        run: |
          set -euo pipefail
          test "$SCOPE_RESULT" = success
          if [[ "$CODE_CHANGED" == false ]]; then
            echo 'Documentation only: no application code changed.'
          else
            test "$CODE_CHANGED" = true
            test "$STATIC_RESULT" = success
            test "$BROWSER_RESULT" = success
          fi
