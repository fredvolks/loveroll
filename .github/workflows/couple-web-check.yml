                !tactile.pressed)
               throw Error('Real tactile HTML controls must be visible and pressed: '+JSON.stringify(tactile));
            }
            await page.screenshot({path:'landing-captures/'+d.name+'-VRAI-ACCUEIL-PREMIUM.png'});
