          node --check couple-web/demo-couple.mjs
          node --check couple-web/invite-links.mjs
          node --check couple-web/wellbeing.mjs
          node --check couple-web/config.js
          node --check couple-web/couple-dashboard.mjs
          node --check couple-web/home-install.mjs
          node --check couple-web/json-libraries.mjs
          node --check couple-web/json-library-ui.mjs
          node --check couple-web/invite-email.mjs
