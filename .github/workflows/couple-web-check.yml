          node --check couple-web/premium-invite-auth-visual-check.cjs
          node --check couple-web/premium-settings-visual-check.cjs
      - name: Validate Messenger image renderer
        run: |
          python3 -m pip install --user 'Pillow>=10,<13'
          python3 couple-web/make-social-preview.py
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          path=Path('couple-web/assets/loveroll-invite-og.png')
          with Image.open(path) as graphic:
              assert graphic.size==(1200,630)
              assert graphic.format=='PNG'
          assert path.stat().st_size>30000
          scene=Path('couple-web/assets/loveroll-premium-scene.png')
          with Image.open(scene) as graphic: assert graphic.size==(1200,630)
          assert scene.stat().st_size>30000
          card=Path('couple-web/assets/loveroll-messenger-og-v142.jpg')
          with Image.open(card) as image:
              assert image.size==(1200,630)
              assert image.format=='JPEG' and image.mode=='RGB'
          assert 30000 < card.stat().st_size < 250000
          page=Path('couple-web/index.html').read_text(encoding='utf8')
          assert 'loveroll-messenger-og-v142.jpg' in page
          assert 'og:image:type" content="image/jpeg"' in page
          PY
      - name: Validate HD invitation artwork and crisp SVG icons
        run: |
          python3 design/loveroll-icon/check.py
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          asset=Path('couple-web/assets/loveroll-invitation-scene-v139.webp')
          with Image.open(asset) as im:
              im.verify()
          with Image.open(asset) as im:
              assert im.width>=900 and im.height>=450 and im.format=='WEBP'
          assert asset.stat().st_size>80000, 'Invitation must use a high-resolution asset'
          page=Path('couple-web/discover.mjs').read_text(encoding='utf8')
          styles=Path('couple-web/entry-ritual-v139.css').read_text(encoding='utf8')
          assert 'loveroll-invitation-scene-v139.webp' in page
          assert 'editorialIcon(icon)' in page
          assert 'discover-ritual' in page
          assert '.discover-ritual .discover-editorial-icon svg' in styles
          assert '.discover-ritual .discover-accept' in styles
          assert 'entry-ritual-v139.css' in Path('couple-web/index.html').read_text()
          PY
      - name: Static security and logic contracts
        run: node --test couple-web/reset-ghost-session.test.mjs couple-web/all-dice-reset.test.mjs couple-web/dice-roll-motion.test.mjs couple-web/checks.test.mjs couple-web/couple-dashboard.test.mjs couple-web/json-libraries.test.mjs couple-web/push-and-invite.test.mjs couple-web/evening-turns.test.mjs couple-web/discover-flow.test.mjs couple-web/invite-links.test.mjs couple-web/signup-routing.test.mjs couple-web/stale-invitation-safari.test.mjs couple-web/dice-weighting.test.mjs couple-web/cycle-200.test.mjs couple-web/calendar-success-stats.test.mjs couple-web/love-category-style.test.mjs couple-web/dissociation-solo-admin.test.mjs couple-web/demo-couple.test.mjs couple-web/email-auth.test.mjs couple-web/premium-home.test.mjs couple-web/force-weekly-reset.test.mjs couple-web/pwa-update.test.mjs couple-web/premium-couple-pages.test.mjs couple-web/dice-visibility-layout.test.mjs couple-web/settings-premium.test.mjs couple-web/invite-password-auth.test.mjs couple-web/auth-push-dice.test.mjs couple-web/email-confirm-existing-google.test.mjs couple-web/existing-account-profile.test.mjs couple-web/native-bridge-login-recovery.test.mjs couple-web/android-native-bridge-thread.test.mjs couple-web/premium-advent.test.mjs couple-web/premium-dialogs.test.mjs couple-web/audit-journal-regressions.test.mjs couple-web/boot-hotfix.test.mjs

      - name: Verify evening finale actions and privacy control (deployment parity)
        run: node --test couple-web/evening-finale-v99.test.mjs

      - name: Validate iPad uses exact Android HD v202 scene and one marble pedestal
        run: node --test couple-web/ipad-android-stage-v236.test.mjs
      - name: Verify real native premium Home buttons
        run: node --test couple-web/loveroll-home-native-v193.test.mjs

      - name: Verify Surprise D100, prices and D6 pair/impair flow
        run: node --test couple-web/surprise-v86.test.mjs couple-web/surprise-host-flow-v107.test.mjs couple-web/surprise-date-editor-v109.test.mjs couple-web/surprise-d100-budget.test.mjs

      - name: Fail on syntax errors in any shipped JS file
        run: node couple-web/check-shipped-js.cjs

  browser-tests:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        group: [entry, dice, experience]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Cache npm downloads and pinned Chromium
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/.cache/ms-playwright
          key: ${{ runner.os }}-loveroll-playwright-1.56.0-v1
      - name: Prepare browser checks
        run: |
          set -euo pipefail
          npm install --no-save --no-audit --no-fund playwright@1.56.0
          npx playwright install chromium
          python3 -m pip install --quiet 'Pillow>=10,<13'
          mkdir -p landing-captures design-captures
          python3 -m http.server 8765 -d couple-web >/tmp/loveroll-ci-http.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/loveroll-ci-http.log
          exit 1
      - name: Capture landing on Galaxy S25 Ultra representative viewport
        if: matrix.group == 'entry'
        run: |
          set -euo pipefail
          cat > couple-web/__landing-test.html <<'EOF'
          <!doctype html><html lang="fr-CA"><head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <link rel="stylesheet" href="./styles.css"></head>
          <body><main id="app"></main>
          <script type="module">
          import {marketingHtml} from './onboarding.mjs';
          document.querySelector('#app').innerHTML=marketingHtml();
          </script></body></html>
          EOF
          mkdir -p landing-captures
          cat > capture-landing.cjs <<'EOF'
          const { chromium } = require('playwright');
          (async () => {
            const browser=await chromium.launch({headless:true});
            for(const {name,width,height,requireOneScreen} of [
              {name:'S25-Ultra',width:412,height:824,requireOneScreen:true},
              {name:'S25-Ultra-long',width:412,height:915,requireOneScreen:true},
              {name:'Petit-Android',width:360,height:700,requireOneScreen:false},
              {name:'iPhone',width:393,height:780,requireOneScreen:false},
              {name:'iPad-portrait',width:820,height:1180,requireOneScreen:false},
              {name:'iPad-landscape',width:1180,height:820,requireOneScreen:false}
            ]){
              const page=await browser.newPage({viewport:{width,height},deviceScaleFactor:2,
                isMobile:true,hasTouch:true});
              await page.goto('http://127.0.0.1:8765/__landing-test.html',{waitUntil:'load'});
              await page.locator('.love-hero-art').waitFor();
              await page.waitForFunction(()=>document.querySelector('.love-hero-art')?.complete);
              const data=await page.evaluate(()=>{
                const ct=[...document.querySelectorAll('[data-action="show-auth"]')];
                const top=document.querySelector('.love-cta-group').getBoundingClientRect();
                const image=document.querySelector('.love-hero-art');
                const legal=document.querySelector('.love-compact-footer').getBoundingClientRect();
                const main=document.querySelector('.marketing-shell').getBoundingClientRect();
                return {
                  ctas:ct.length, imageLoaded:image.naturalWidth>0,
                  buttonsVisible:ct.every(b=>b.getBoundingClientRect().width>0),
                  noHorizontalOverflow:document.documentElement.scrollWidth<=innerWidth+2,
                  buttonsInFirstScreen:top.bottom<innerHeight-8,
                  oneScreen:Math.max(document.documentElement.scrollHeight,document.body.scrollHeight)<=innerHeight+2&&legal.bottom<=innerHeight+2,
                  legalVisible:legal.width>0,
                  footerBottom:Math.round(legal.bottom),
                  screenHeight:innerHeight,
                  pageHeight:Math.round(main.height),
                  accessibleButtons:ct.every(b=>b.getBoundingClientRect().height>=48),
                  features:document.querySelectorAll('.love-feature').length,
                  emotionalBanners:document.querySelectorAll('.love-mini-finale').length
                };
              });
              if(data.ctas!==2||!data.imageLoaded||!data.buttonsVisible||
                !data.noHorizontalOverflow||!data.buttonsInFirstScreen||
                !data.accessibleButtons||!data.legalVisible||
                (requireOneScreen&&!data.oneScreen)||
                data.features!==4||data.emotionalBanners!==1){
                throw new Error(name+': '+JSON.stringify(data));
              }
              await page.screenshot({path:'landing-captures/'+name+'-premier-ecran.png'});
              await page.screenshot({path:'landing-captures/'+name+'-page-complete.png',fullPage:true});
              console.log(name,JSON.stringify(data));
              await page.close();
            }
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          EOF
          node capture-landing.cjs
          cat > couple-web/__tablet-settings-test.html <<'EOF'
          <!doctype html><html lang="fr-CA"><head><meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
          <link rel="stylesheet" href="./styles.css"></head><body>
          <main><header class="header"><h1>♡ Réglages</h1></header>
            <div class="settings-grid">
              <details class="settings-group" open><summary><span class="settings-group-icon">♡</span>
                <span class="settings-group-heading"><strong>Compte</strong><small>Profil</small></span></summary>
                <div class="settings-group-content"><button>Gérer mon profil</button></div></details>
              <details class="settings-group"><summary><span class="settings-group-icon">♥</span>
                <span class="settings-group-heading"><strong>Couple</strong><small>Invitations</small></span></summary></details>
              <details class="settings-group"><summary><span class="settings-group-icon">🎲</span>
                <span class="settings-group-heading"><strong>Jeu</strong><small>Défis</small></span></summary></details>
              <details class="settings-group"><summary><span class="settings-group-icon">♧</span>
                <span class="settings-group-heading"><strong>Notifications</strong><small>Rappels</small></span></summary></details>
            </div>
            <nav class="nav"><div class="nav-inner">
              <button>Accueil</button><button>Soirée</button><button>Défi spécial</button>
              <button>Avent</button><button>Réglages</button></div></nav>
          </main></body></html>
          EOF
          cat > verify-ipad.cjs <<'EOF'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch();
            for(const device of [
              {name:'iPad portrait',width:820,height:1180,columns:2},
              {name:'iPad paysage',width:1180,height:820,columns:3},
              {name:'iPhone',width:390,height:844,columns:1}
            ]){
              const page=await browser.newPage({viewport:{width:device.width,height:device.height},isMobile:true,hasTouch:true});
              await page.goto('http://127.0.0.1:8765/__tablet-settings-test.html');
              const check=await page.evaluate(()=>{
                const grid=document.querySelector('.settings-grid');
                const widths=getComputedStyle(grid).gridTemplateColumns.split(' ').length;
                return {columns:widths,mainWidth:document.querySelector('main').getBoundingClientRect().width,
                  overflow:document.documentElement.scrollWidth>innerWidth+2,
                  navButtons:document.querySelectorAll('.nav button').length};
              });
              if(check.columns!==device.columns||check.overflow||check.navButtons!==5||
                (device.width>700&&check.mainWidth<700))
                throw Error(device.name+': '+JSON.stringify(check));
              await page.locator('.settings-group:nth-child(2) summary').click();
              if(!await page.locator('.settings-group:nth-child(2)').evaluate(e=>e.open))
                throw Error('Settings accordion cannot open on '+device.name);
              await page.screenshot({path:'landing-captures/'+device.name.replace(' ','-')+'-reglages.png'});
              console.log(device.name,check);
              await page.close();
            }
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          EOF
          node verify-ipad.cjs
          node --test couple-web/editorial-details.test.mjs
      - name: Capture actual premium invitation and account pages on S25 / iPhone
        if: matrix.group == 'entry'
        run: |
          node couple-web/premium-invite-auth-visual-check.cjs

      - name: Verify and capture true premium couple home with WebGL
        if: matrix.group == 'entry'
        run: |
          set -euo pipefail
          cat > couple-web/__real-home-test.html <<'EOF'
          <!doctype html><html lang="fr-CA"><head>
          <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
          <link rel="stylesheet" href="./styles.css">
          <link rel="stylesheet" href="./satin-reference.css">
          <link rel="stylesheet" href="./mobile-one-screen-v74.css">
          <link rel="stylesheet" href="./premium-theme.css">
          <link rel="stylesheet" href="./premium-home.css">
          </head><body><main id="app" class="loveroll-real-home"></main>
          <script type="module">
          import {premiumHomeHtml} from './premium-home.mjs';
          import {dieOn} from './dice3d.js';
          const root=document.querySelector('#app');
          const unrolled=new URLSearchParams(location.search).has('unrolled');
          const weekly=unrolled?null:{
            face:2,actor:'owner',created_at:'2026-10-14T15:00:00Z'
          };
          // The connected app renders premiumHomeHtml directly; its logo is inside.
          root.innerHTML=premiumHomeHtml({
            weekly,members:[{user_id:'owner',name:'Fred'},{user_id:'partner',name:'Émilie'}],
            challenges:[
              {recipient:'owner',category:'SENSUEL',status:'pending'},
              {recipient:'owner',category:'SEXUEL',status:'done'},
              {recipient:'partner',category:'SENSUEL',status:'pending'}
            ],
            history:unrolled?[]:[
              {session_id:'historical-1',recipient:'owner',category:'SENSUEL',status:'completed',created_at:'2026-10-07T15:00:00Z'},
              {session_id:'historical-1',recipient:'partner',category:'SEXUEL',status:'completed',created_at:'2026-10-07T15:00:00Z'}
            ],
            sessions:unrolled?[]:[{id:'historical-1',finished_at:'2026-10-07T18:00:00Z',counted:true}],
            now:new Date('2026-10-14T15:00:00Z')
          })+
          '<nav class="nav"><div class="nav-inner">'+
          [['⌂','Accueil'],['☾','Soirée'],['✦','Surprise'],['🎁','Avent'],['⚙','Réglages']].map(
           ([ic,name],i)=>'<button class="'+(i===0?'active':'')+'"><span>'+ic+'</span>'+name+'</button>').join('')+
          '</div></nav>';
          const canvas=root.querySelector('canvas');
          window.__dieCleanup=dieOn(canvas,6,Number(canvas.dataset.face),false);
          </script></body></html>
          EOF
          # All Home screenshots MUST load the same CSS cascade as index.html.
          python3 - <<'PY'
          from pathlib import Path
          import re
          actual=Path('couple-web/index.html').read_text(encoding='utf8')
          links=re.findall(r'<link rel="stylesheet" href="([^"]+)"',actual)
          assert any('loveroll-home-parity-v187.css' in href for href in links)
          page=Path('couple-web/__real-home-test.html')
          markup=page.read_text(encoding='utf8')
          markup=re.sub(r'<link rel="stylesheet" href="[^"]+">\s*','',markup)
          styles=''.join(f'<link rel="stylesheet" href="{href}">' for href in links)
          markup=markup.replace('</head>',styles+'<script defer src="./loveroll-home-touch-v193.js?v=20261020-native193"></script></head>')
          page.write_text(markup,encoding='utf8')
          print('HOME_PRODUCTION_CSS_LAYERS',len(links))
          PY
          cat > verify-real-home.cjs <<'EOF'
          const {chromium}=require('playwright');
          (async()=>{
           const browser=await chromium.launch({headless:true,args:['--enable-webgl','--use-gl=angle','--use-angle=swiftshader','--enable-unsafe-swiftshader']});
           for(const d of [{name:'S25-Ultra',width:412,height:824},
                            {name:'S25-Ultra-long',width:412,height:915}]){
            const page=await browser.newPage({viewport:{width:d.width,height:d.height},
             deviceScaleFactor:2,isMobile:true,hasTouch:true});
            const errors=[];page.on('pageerror',e=>errors.push(e.message));
            await page.goto('http://127.0.0.1:8765/__real-home-test.html'+(d.name==='S25-Ultra'?'?unrolled':''),{waitUntil:'load'});
            await page.locator('.home-die-platform canvas').waitFor({state:'attached'});
            await page.waitForFunction(()=>document.querySelector('.home-die-platform canvas')?.dataset.webglReady==='true',null,{timeout:18000});
            if(d.name==='S25-Ultra'){
             await page.waitForFunction(()=>{
              const root=document.getElementById('app');
              const b=root?.querySelector('button.home-roll-button');
              return root?.classList.contains('loveroll-real-home')&&b&&getComputedStyle(b).opacity==='1';
             },null,{timeout:14000});
            }
            await page.waitForTimeout(800);
            const data=await page.evaluate(()=>{
             const nav=document.querySelector('.nav').getBoundingClientRect();
             const shorts=document.querySelector('.home-stats-grid').getBoundingClientRect();
             const weights=document.querySelectorAll('.home-weight');
             const root=document.querySelector('#app');
             const canvas=document.querySelector('.home-die-platform canvas');
             return {
              oneScreen:document.documentElement.scrollHeight<=innerHeight+2&&root.scrollHeight<=innerHeight+2,
              lastCardVisible:shorts.bottom<=nav.top+2,
              horizontalOverflow:document.documentElement.scrollWidth>innerWidth+2,
              weights:weights.length,stats:document.querySelectorAll('.home-stat-card').length,
              nav:document.querySelectorAll('.nav button').length,
              webgl:canvas.dataset.webglReady==='true',
              canvasHeight:Math.round(canvas.getBoundingClientRect().height),
              pageHeight:document.documentElement.scrollHeight,windowHeight:innerHeight,
              cardBottom:Math.round(shorts.bottom),navTop:Math.round(nav.top)
             };
            });
            console.log(d.name,JSON.stringify({data,errors}));
            if(errors.length||!data.oneScreen||!data.lastCardVisible||data.horizontalOverflow||
              data.weights!==6||data.stats!==4||data.nav!==5||!data.webgl||data.canvasHeight<100)
             throw Error('Accueil réel non conforme '+d.name+' '+JSON.stringify({data,errors}));
            if(d.name==='S25-Ultra'){
             const tactile=await page.evaluate(()=>{
              const app=document.getElementById('app');
              const names=['.home-roll-button','.home-next-month','.nav button.active'];
              const controls=names.map(selector=>{
               const node=app.querySelector(selector),style=getComputedStyle(node);
               return {selector,opacity:style.opacity,background:style.backgroundImage,
                visible:!!node.getBoundingClientRect().width,enabled:!node.disabled};
              });
              const btn=app.querySelector('.home-roll-button');
              btn.dispatchEvent(new PointerEvent('pointerdown',{bubbles:true,button:0,isPrimary:true}));
              const pressed=btn.classList.contains('lr-pressed');
              const transform=getComputedStyle(btn).transform;
              btn.dispatchEvent(new PointerEvent('pointerup',{bubbles:true,button:0}));
              return {controls,pressed,transform,cleared:true};
             });
             console.log('HOME_TACTILE_CONTROLS',JSON.stringify(tactile));
