name: LR-019 PostgreSQL favorites checks
on:
  pull_request:
    branches: [main]
    paths:
      - 'couple-web/migrations/20261026_lr019_favorites_core.sql'
      - 'couple-web/qa/lr019-favorites.sql'
      - '.github/workflows/lr019-favorites-postgres.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  favorites-db:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Check PostgreSQL client
        run: |
          command -v psql || { sudo apt-get update -qq && sudo apt-get install -y postgresql-client; }
      - name: Run isolated SQL contract and access tests
        run: psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f couple-web/qa/lr019-favorites.sql
