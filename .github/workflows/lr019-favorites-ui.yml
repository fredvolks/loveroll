name: LR-019 favorite UI static checks
on:
  pull_request:
    branches: [feat/lr019-favorites-draw-lr015-20261026]
    paths:
      - 'couple-web/app.js'
      - 'couple-web/evening-calendar.mjs'
      - 'couple-web/evening-calendar.css'
      - 'couple-web/evening-calendar-browser-check.cjs'
      - 'couple-web/lr019-favorites-ui.test.mjs'
      - '.github/workflows/lr019-favorites-ui.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  favorite-ui-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify app syntax and controlled heart flows
        run: |
          node --check couple-web/app.js
          node --check couple-web/evening-calendar.mjs
          node --test couple-web/lr019-favorites-ui.test.mjs
          node --test couple-web/evening-private-queue.test.mjs couple-web/evening-turns.test.mjs

      - name: Browser verification of archive hearts on Android iPhone tablet and desktop
        run: |
          npm install --no-save playwright@1.56.0
          npx playwright install chromium
          # Calendar browser smoke expects the same local static server as the main CI.
          # Without it, stylesheet requests fail silently and layout assertions
          # measure an unstyled fallback instead of the actual LoveRoll page.
          python3 -m http.server 8765 --bind 127.0.0.1 --directory couple-web > /tmp/loveroll-lr019-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8765/ >/dev/null; then break; fi
            sleep 0.25
          done
          curl -fsS http://127.0.0.1:8765/evening-calendar.css > /dev/null
          node couple-web/evening-calendar-browser-check.cjs
