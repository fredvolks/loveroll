name: Déployer LoveRoll Web sur GitHub Pages
# Supabase's free domain intentionally refuses to render HTML; deploy static frontend to Pages.
on:
  push:
    branches: [main]
    paths:
      - 'couple-web/**'
      - '.github/workflows/deploy-couple-web.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: loveroll-pages-main
  cancel-in-progress: true
jobs:
  static-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Valider la PWA, l'authentification et l'adaptation mobile
        run: |
          set -euo pipefail
          node --check couple-web/app.js
          node --check couple-web/evening-eclat-switcher.mjs
          test -s couple-web/assets/eclat-photo-strip.webp
          node --check couple-web/eclat-ui.mjs
          node --test couple-web/ipad-android-stage-v236.test.mjs
          node --test couple-web/evening-resume.test.mjs
          node --test couple-web/evening-category-confirm.test.mjs
          node --test couple-web/ipad-soiree-one-photo-v237.test.mjs
          node --test couple-web/pages-entry-parallel-contract.test.mjs
          node --test couple-web/lr016-pass-quota-live-sync.test.mjs
          node --test couple-web/ruby-visual-v182.test.mjs
          node --test couple-web/cinematic-v183.test.mjs
          node --check couple-web/dice3d.js
          node --check couple-web/eclat-ui.mjs
          node --check couple-web/account-preview-mode.mjs
          node --check couple-web/loveroll-premium-pickers.mjs
          node --check couple-web/platform-admin.js
          node --check couple-web/loveroll-splash.js
          node --check couple-web/boot-recovery.js
          node --check couple-web/entry-viewport-v78.js
          node --check couple-web/mobile-entry-visual-check.cjs
          node --check couple-web/evening-redesign-browser-check.cjs
          node --check couple-web/surprise-desktop-v86-check.cjs
          node --test couple-web/lr027-primary-action.test.mjs
          node --test couple-web/evening-d100-template.test.mjs couple-web/surprise-minimal.test.mjs couple-web/evening-d6-template.test.mjs couple-web/eclat-guidance.test.mjs couple-web/monthly-invitation.test.mjs couple-web/signup-routing.test.mjs couple-web/stale-invitation-safari.test.mjs couple-web/dice-weighting.test.mjs couple-web/cycle-200.test.mjs couple-web/calendar-success-stats.test.mjs couple-web/love-category-style.test.mjs couple-web/dissociation-solo-admin.test.mjs couple-web/mobile-entry-screen.test.mjs couple-web/loveroll-splash.test.mjs couple-web/pwa-update.test.mjs couple-web/eclat.test.mjs couple-web/evening-finale-v99.test.mjs couple-web/premium-couple-pages.test.mjs couple-web/evening-redesign.test.mjs couple-web/surprise-v86.test.mjs couple-web/surprise-d100-budget.test.mjs couple-web/eclat-history.test.mjs couple-web/evening-queue-fixed-v102.test.mjs
      - name: Vérifier TOUS les scripts JavaScript livrés
        run: node couple-web/check-shipped-js.cjs
      - name: Verify every HTML-linked Web asset exists and CSS is unique
        run: node --test couple-web/shipped-referenced-assets.test.mjs
  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        group: [entry-interaction, entry-layout, evening, experience]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Cache npm downloads and pinned Chromium
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/.cache/ms-playwright
          key: ${{ runner.os }}-loveroll-playwright-1.56.0-v1
      - name: Prepare Chromium and local server
        run: |
          set -euo pipefail
          npm install --no-save --no-audit --no-fund playwright@1.56.0
          npx playwright install chromium
          python3 -m pip install --quiet 'Pillow>=10,<13'
          python3 couple-web/make-social-preview.py
          python3 -m http.server 8765 -d couple-web >/tmp/loveroll-pages-http.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/loveroll-pages-http.log
          exit 1
      # Two parallel, mandatory entry lanes. The former single lane could
      # hold all Pages publication while software WebGL warmed up.
      - name: Validate entry interaction before publication
        if: matrix.group == 'entry-interaction'
        run: |
          set -euo pipefail
          node couple-web/boot-smoke.cjs
          node couple-web/home-ruby-interaction-browser-check.cjs
          node couple-web/ruby-controls-browser-check.cjs
          node couple-web/home-duo-browser-check.cjs
          node couple-web/loveroll-splash-browser-check.cjs
      - name: Validate entry layout before publication
        if: matrix.group == 'entry-layout'
        run: |
          set -euo pipefail
          node couple-web/android-ruby-browser-check.cjs
          node couple-web/soiree-home-template-browser-check.cjs
          node couple-web/surprise-minimal-browser-check.cjs
          node couple-web/checkout-one-screen-browser-check.cjs
          node couple-web/surprise-desktop-v86-check.cjs
          # Preserve the existing non-blocking layout-only diagnostic.
          # No layout warning may bypass the mandatory functional tests above.
          if ! node couple-web/mobile-entry-visual-check.cjs; then
            echo '::warning::Responsive visual check needs follow-up; publishing current authenticated PWA instead of leaving stale web version.'
          fi
      - name: Validate evening before publication
        if: matrix.group == 'evening'
        run: |
          set -euo pipefail
          node couple-web/evening-d6-template-browser-check.cjs
          node couple-web/evening-d100-template-browser-check.cjs
          node couple-web/evening-category-confirm-browser-check.cjs
          node couple-web/ipad-romance-scene-browser-check.cjs
          node couple-web/shared-stage-browser-check.cjs
          node couple-web/evening-redesign-browser-check.cjs
          node couple-web/evening-queue-fixed-v102-browser-check.cjs
          node couple-web/evening-queue-completed-v103-browser-check.cjs
      - name: Validate experience before publication
        if: matrix.group == 'experience'
        run: |
          set -euo pipefail
          node couple-web/eclat-night-browser-check.cjs
          node couple-web/eclat-guided-browser-check.cjs
          node couple-web/eclat-browser-check.cjs
          node couple-web/eclat-visual-parity-v184.cjs
          python3 couple-web/eclat-pixel-reference-v184.py
          node couple-web/settings-menus-browser-check.cjs
          node couple-web/settings-picker-browser-check.cjs
          node couple-web/eclat-parity-browser-check.cjs
          node couple-web/nav-home-parity-browser-check.cjs
          node couple-web/bubble-alignment-browser-check.cjs
  deploy:
    needs: [static-tests, browser-tests]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Cache npm downloads and pinned Chromium
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/.cache/ms-playwright
          key: ${{ runner.os }}-loveroll-playwright-1.56.0-v1
      - name: Activer Pages et préparer le site
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Construire la bannière HD LoveRoll pour Messenger
        run: |
          python3 -m pip install --user 'Pillow>=10,<13'
          python3 couple-web/make-social-preview.py
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          asset=Path('couple-web/assets/loveroll-invite-og.png')
          with Image.open(asset) as im:
              assert im.size==(1200,630), im.size
              assert im.format=='PNG'
          assert asset.stat().st_size>30000
          scene=Path('couple-web/assets/loveroll-premium-scene.png')
          with Image.open(scene) as graphic: assert graphic.size==(1200,630)
          assert scene.stat().st_size>30000
          print('Open Graph image OK:',asset.stat().st_size,'bytes')
          PY
      - name: Téléverser uniquement la PWA (aucun fichier Android ni secret)
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages-${{ github.run_attempt }}
          path: couple-web/
      - name: Déployer sur Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
      - name: Vérifier le site réellement publié et la console de Chromium
        timeout-minutes: 6
        run: |
          set -euo pipefail
          npm install --no-save --no-audit --no-fund playwright@1.56.0
          npx playwright install chromium
          for attempt in 1 2 3 4; do
            echo "Validation production - tentative $attempt"
            if LOVEROLL_DIAGNOSTIC_URL=https://fredvolks.github.io/loveroll/ LOVEROLL_REQUIRE_HEALTHY=1 node couple-web/boot-diagnostic.cjs; then
              echo "LoveRoll Pages démarre réellement sur le domaine public."
              exit 0
            fi
            sleep 10
          done
          echo "::error::Le site public ne démarre pas avec la version publiée."
          exit 1
