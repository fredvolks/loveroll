name: LoveRoll HTML accessibility audit tests

on:
  push:
    branches: [main]
    paths:
      - '**/*.html'
      - '**/*.htm'
      - 'tools/audit_html_controls.py'
      - 'tools/test_audit_html_controls.py'
      - '.github/workflows/html-accessibility-audit.yml'
  pull_request:
    paths:
      - '**/*.html'
      - '**/*.htm'
      - 'tools/audit_html_controls.py'
      - 'tools/test_audit_html_controls.py'
      - '.github/workflows/html-accessibility-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python syntax validation
        run: python -m compileall -q tools/audit_html_controls.py tools/test_audit_html_controls.py
      - name: Accessibility parser unit tests
        run: python -m unittest discover -s tools -p 'test_audit_html_controls.py' -v
      - name: Audit repository HTML (required)
        id: html_audit
        shell: bash
        run: |
          set -o pipefail
          python tools/audit_html_controls.py . 2>&1 | tee html-accessibility-audit.txt
      - name: Publish audit summary
        if: always()
        shell: bash
        run: |
          {
            echo '### LoveRoll — contrôle accessibilité HTML'
            echo ''
            echo '```text'
            if [ -f html-accessibility-audit.txt ]; then
              cat html-accessibility-audit.txt
            else
              echo 'Rapport absent : vérifier les étapes précédentes.'
            fi
            echo '```'
            echo ''
            echo 'Contrôle statique seulement ; le rendu JS, les interactions tactiles et les dimensions responsive doivent être vérifiés dans un navigateur.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload HTML audit findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: loveroll-html-accessibility-findings
          path: html-accessibility-audit.txt
          if-no-files-found: warn
          retention-days: 14
